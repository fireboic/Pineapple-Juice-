<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fefce8; }
      .header-bg { fill: #fef08a; stroke: #fde047; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #fef08a; stroke-width: 2; rx: 12px; }
      .accent-yellow { fill: #eab308; }
      .accent-orange { fill: #f97316; }
      .accent-red { fill: #ef4444; }
      .accent-green { fill: #84cc16; }
      .text-main { fill: #713f12; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; }
      .text-muted { fill: #a16207; font-family: system-ui, -apple-system, sans-serif; font-weight: 500; }
      .text-light { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 600; }
      .wireframe-pill { fill: #fde047; rx: 6px; }
      .badge-hot { fill: #ef4444; rx: 4px; }
      .badge-best { fill: #f97316; rx: 4px; }

      .game-card { cursor: pointer; }
      .game-card:hover .card { stroke: #f97316; filter: drop-shadow(0px 4px 10px rgba(249, 115, 22, 0.25)); }
      .close-btn:hover { fill: #ea580c; }

      #player-overlay { display: none; }
    </style>

    <script type="text/javascript">
      
        function launchGame(filename) {
          var overlay = document.getElementById('player-overlay');
          var frame = document.getElementById('game-frame-elem');
          
          // Connects directly to your jsDelivr raw link
          frame.src = 'https://cdn.jsdelivr.net/gh/fireboic/Pineapple-Juice-@main/' + filename;
          overlay.style.display = 'block';
        }

        function closeGame() {
          var overlay = document.getElementById('player-overlay');
          var frame = document.getElementById('game-frame-elem');
          frame.src = 'about:blank';
          overlay.style.display = 'none';
        }
      
    </script>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" class="bg" />

  <!-- Navigation Header -->
  <rect x="0" y="0" width="1200" height="75" class="header-bg" />
  
  <!-- Pineapple Juice Logo -->
  <circle cx="50" cy="37" r="18" class="accent-yellow" />
  <path d="M 45 20 Q 50 12 55 20 Q 50 24 45 20 Z" class="accent-green" />
  <text x="80" y="44" class="text-main" font-size="24">Pineapple Juice 🍍</text>

  <!-- Navigation Buttons -->
  <text x="620" y="43" class="text-main" font-size="15">Home</text>
  <rect x="690" y="22" width="90" height="34" class="wireframe-pill" />
  <text x="705" y="43" class="text-main" font-size="15">Pages ▾</text>
  <rect x="795" y="22" width="90" height="34" class="wireframe-pill" />
  <text x="812" y="43" class="text-main" font-size="15">Games</text>
  
  <!-- Quick Play Action Button -->
  <g class="game-card" onclick="launchGame(&#39;duckmath.svg&#39;)">
    <rect x="1010" y="20" width="140" height="36" class="accent-orange" rx="18" />
    <text x="1038" y="43" class="text-light" font-size="14">Play Now</text>
  </g>

  <!-- Hero Section -->
  <rect x="150" y="110" width="900" height="180" class="card" />
  <text x="600" y="170" class="text-main" font-size="38" text-anchor="middle">Welcome to Pineapple Juice!</text>
  <text x="600" y="205" class="text-muted" font-size="17" text-anchor="middle">Your fresh spot for web games, hosted 100% on jsDelivr CDN.</text>
  
  <!-- Search Bar -->
  <rect x="350" y="225" width="500" height="44" fill="#ffffff" stroke="#eab308" stroke-width="2" rx="8" />
  <text x="370" y="252" class="text-muted" font-size="14">Search games or pages...</text>
  <rect x="740" y="230" width="105" height="34" class="accent-yellow" rx="6" />
  <text x="770" y="252" class="text-main" font-size="13">Search</text>

  <!-- Section Title -->
  <text x="150" y="335" class="text-main" font-size="24">🎮 Featured Games</text>

  <!-- Game Card 1: DuckMath -->
  <g class="game-card" onclick="launchGame(&#39;duckmath.svg&#39;)">
    <rect x="150" y="360" width="420" height="220" class="card" />
    <rect x="170" y="380" width="380" height="100" fill="#fef08a" rx="8" />
    <circle cx="360" cy="430" r="24" class="accent-orange" />
    <text x="353" y="437" class="text-light" font-size="20">▶</text>
    <text x="170" y="515" class="text-main" font-size="18">DuckMath</text>
    <text x="170" y="535" class="text-muted" font-size="13">duckmath.svg • Play math & puzzle games</text>
    <rect x="170" y="548" width="65" height="20" class="badge-best" />
    <text x="180" y="562" class="text-light" font-size="10">BEST ⭐</text>
  </g>

  <!-- Game Card 2: Stick Fight -->
  <g class="game-card" onclick="launchGame(&#39;ST.svg&#39;)">
    <rect x="630" y="360" width="420" height="220" class="card" />
    <rect x="650" y="380" width="380" height="100" fill="#fef08a" rx="8" />
    <circle cx="840" cy="430" r="24" class="accent-red" />
    <text x="833" y="437" class="text-light" font-size="20">▶</text>
    <text x="650" y="515" class="text-main" font-size="18">Stick Fight</text>
    <text x="650" y="535" class="text-muted" font-size="13">ST.svg • Action & brawler game</text>
    <rect x="650" y="548" width="60" height="20" class="badge-hot" />
    <text x="663" y="562" class="text-light" font-size="10">HOT 🔥</text>
  </g>

  <!-- Footer Info -->
  <text x="600" y="660" class="text-muted" font-size="14" text-anchor="middle">Pineapple Juice • Powered completely via jsDelivr CDN</text>

  <!-- Full-Screen In-SVG Game iFrame Modal -->
  <g id="player-overlay">
    <rect x="0" y="0" width="1200" height="850" fill="#0f172a" opacity="0.96" />
    
    <!-- Close Button -->
    <g class="game-card" onclick="closeGame()">
      <rect x="40" y="25" width="110" height="40" class="accent-orange close-btn" rx="8" />
      <text x="60" y="50" class="text-light" font-size="15">← Close</text>
    </g>

    <!-- Embedded iFrame Loader -->
    
      
    
  </g>
</svg>
